name: Node.js CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Check compiled output is clean
        run: |
          if git status --porcelain --untracked-files=all -- ./dist | grep -q '^?? '; then
            git status --short -- ./dist
            echo "::error::./dist has untracked files after build"
            exit 1
          fi
          if ! git diff --ignore-space-at-eol --quiet -- ./dist; then
            git diff --ignore-space-at-eol -- ./dist
            echo "::error::./dist has uncommitted changes after build"
            exit 1
          fi
